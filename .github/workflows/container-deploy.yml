name: Build and deploy FUSE MCP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fuse-mcp-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_HOST: 72.60.10.108
  DEPLOY_USER: root
  VPS_HOST_FINGERPRINT: SHA256:qEkOWNaWFZykVFmF/pMUlWvXYssbO0byQTW4KfcnHPU

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: image
        run: echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Install SSH password client and validate VPS identity
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 10 -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          actual_fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')"
          test "$actual_fingerprint" = "$VPS_HOST_FINGERPRINT"
      - name: Copy the production Compose manifest
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'install -d -m 0755 /opt/fuse-mcp-platform'
          sshpass -e scp -o StrictHostKeyChecking=yes compose.production.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/fuse-mcp-platform/compose.production.yaml"
      - name: Pull the immutable image and restart only FUSE MCP
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          FUSE_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "FUSE_IMAGE='$FUSE_IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_PULL_TOKEN='$GHCR_PULL_TOKEN' bash -se" <<'REMOTE'
            set -eu
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd /opt/fuse-mcp-platform
            FUSE_IMAGE="$FUSE_IMAGE" docker compose -f compose.production.yaml pull
            FUSE_IMAGE="$FUSE_IMAGE" docker compose -f compose.production.yaml up -d --no-build --remove-orphans
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3100/health; then
                exit 0
              fi
              sleep 2
            done
            docker compose -f compose.production.yaml ps
            docker compose -f compose.production.yaml logs --tail=100
            exit 1
          REMOTE
